<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f5">
<title>Cotizador</title>
<style>
  :root{
    --bg:#eef1f5;
    --card:#ffffff;
    --ink:#131a22;
    --muted:#6b7885;
    --line:#dfe4ea;
    --field:#f4f6f9;
    --costo:#94a3b8;
    --inv:#e0a33e;
    --mio:#1f9d76;
    --mio-soft:#e7f5f0;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;
    line-height:1.35;
    padding:18px 14px calc(34px + env(safe-area-inset-bottom));
    display:flex;justify-content:center;
  }
  .app{width:100%;max-width:470px}

  h1{
    font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin:2px 0 14px;text-align:center;
  }

  .tabs{display:flex;gap:6px;background:#e2e7ee;padding:5px;border-radius:14px;margin-bottom:16px}
  .tabs button{
    flex:1;border:0;background:transparent;color:var(--muted);
    font:inherit;font-weight:600;font-size:14.5px;padding:10px 6px;border-radius:10px;cursor:pointer;
  }
  .tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}

  .card{background:var(--card);border-radius:var(--radius);padding:18px 16px;box-shadow:0 1px 3px rgba(16,24,40,.07)}
  .row{margin-bottom:16px}
  .row:last-child{margin-bottom:0}
  label.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px}

  input[type=text]{
    width:100%;border:1px solid var(--line);background:var(--field);
    border-radius:12px;padding:13px 14px;font:inherit;font-size:19px;font-weight:600;color:var(--ink);
    outline:none;
  }
  input[type=text]:focus{border-color:#9fb3c8;background:#fff}
  .fld{position:relative}
  .fld .pre{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;font-weight:600;pointer-events:none}
  .fld .pre ~ input{padding-left:46px}
  .fld .suf{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;font-weight:600;pointer-events:none}
  .fld input.pct{padding-right:34px}

  .result{margin-top:18px;background:var(--card);border-radius:var(--radius);padding:18px 16px;box-shadow:0 1px 3px rgba(16,24,40,.07)}
  .result.mine{background:var(--mio-soft)}
  .rlbl{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .big{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
  .big.ok{color:var(--mio)}
  .sub{font-size:13.5px;color:var(--muted);margin-top:6px}

  .bar{display:flex;height:10px;border-radius:99px;overflow:hidden;margin:16px 0 12px;background:var(--line)}
  .bar i{display:block;height:100%}
  .legend{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;gap:9px;font-size:14.5px}
  .item .dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .item .nm{color:var(--muted)}
  .item .pp{margin-left:auto;color:var(--muted);font-size:12.5px;font-weight:600}
  .item .vl{font-weight:700;font-variant-numeric:tabular-nums;min-width:104px;text-align:right}
  .item.half{font-size:13.5px;margin-top:-2px}
  .item.half .nm{padding-left:19px;position:relative}
  .item.half .nm::before{content:"↳";position:absolute;left:4px;color:var(--line)}
  .item.half .vl{font-weight:600;color:var(--muted)}

  .formula{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  .foot{margin:14px 2px 0;font-size:12px;color:var(--muted);text-align:center;line-height:1.4}
  .warn{color:#b4451f;font-size:14px;font-weight:600;line-height:1.4}
  .hide{display:none}
</style>
</head>
<body>
<div class="app">
  <h1>Cotizador</h1>

  <div class="tabs">
    <button id="tab1" class="on" onclick="showTab(1)">Precio final</button>
    <button id="tab2" onclick="showTab(2)">Cuánto me queda</button>
  </div>

  <!-- ============ PANTALLA 1 ============ -->
  <section id="p1">
    <div class="card">
      <div class="row">
        <label class="lbl" for="c1">Costo de subcontratar</label>
        <div class="fld"><span class="pre">US$</span><input type="text" id="c1" inputmode="decimal" placeholder="800"></div>
      </div>

      <div class="row">
        <label class="lbl" for="i1">Inversionista (% del total)</label>
        <div class="fld"><input class="pct" type="text" id="i1" inputmode="decimal" value="25"><span class="suf">%</span></div>
      </div>

      <div class="row">
        <label class="lbl" for="m1">Para PYB (% del total)</label>
        <div class="fld"><input class="pct" type="text" id="m1" inputmode="decimal" value="20"><span class="suf">%</span></div>
      </div>
    </div>

    <div class="result">
      <div class="rlbl">Precio final al cliente</div>
      <div class="big" id="r1big">—</div>
      <div id="r1body" class="hide">
        <div class="bar"><i id="b1a"></i><i id="b1b"></i><i id="b1c"></i></div>
        <div class="legend">
          <div class="item"><span class="dot" style="background:var(--costo)"></span><span class="nm">Subcontratación</span><span class="pp" id="l1ap"></span><span class="vl" id="l1a"></span></div>
          <div class="item"><span class="dot" style="background:var(--inv)"></span><span class="nm">Inversionista</span><span class="pp" id="l1bp"></span><span class="vl" id="l1b"></span></div>
          <div class="item"><span class="dot" style="background:var(--mio)"></span><span class="nm">Para PYB</span><span class="pp" id="l1cp"></span><span class="vl" id="l1c"></span></div>
          <div class="item half"><span class="nm">PYB ÷ 2</span><span class="pp" id="l1dp"></span><span class="vl" id="l1d"></span></div>
        </div>
        <div class="formula" id="f1"></div>
      </div>
      <div class="sub warn hide" id="r1warn"></div>
    </div>
  </section>

  <!-- ============ PANTALLA 2 ============ -->
  <section id="p2" class="hide">
    <div class="card">
      <div class="row">
        <label class="lbl" for="p2p">Precio final al cliente</label>
        <div class="fld"><span class="pre">US$</span><input type="text" id="p2p" inputmode="decimal" placeholder="1500"></div>
      </div>

      <div class="row">
        <label class="lbl" for="c2">Costo de subcontratar</label>
        <div class="fld"><span class="pre">US$</span><input type="text" id="c2" inputmode="decimal" placeholder="800"></div>
      </div>

      <div class="row">
        <label class="lbl" for="i2">Inversionista (% del total)</label>
        <div class="fld"><input class="pct" type="text" id="i2" inputmode="decimal" value="25"><span class="suf">%</span></div>
      </div>
    </div>

    <div class="result mine">
      <div class="rlbl">Te queda</div>
      <div class="big ok" id="r2big">—</div>
      <div class="sub" id="r2sub"></div>
      <div id="r2body" class="hide">
        <div class="bar"><i id="b2a"></i><i id="b2b"></i><i id="b2c"></i></div>
        <div class="legend">
          <div class="item"><span class="dot" style="background:var(--costo)"></span><span class="nm">Subcontratación</span><span class="pp" id="l2ap"></span><span class="vl" id="l2a"></span></div>
          <div class="item"><span class="dot" style="background:var(--inv)"></span><span class="nm">Inversionista</span><span class="pp" id="l2bp"></span><span class="vl" id="l2b"></span></div>
          <div class="item"><span class="dot" style="background:var(--mio)"></span><span class="nm">Para PYB</span><span class="pp" id="l2cp"></span><span class="vl" id="l2c"></span></div>
          <div class="item half"><span class="nm">PYB ÷ 2</span><span class="pp" id="l2dp"></span><span class="vl" id="l2d"></span></div>
        </div>
      </div>
    </div>
  </section>

  <p class="foot">Los porcentajes quedan guardados para la próxima vez.</p>
</div>

<script>
/* ---------- helpers ---------- */
function num(el){
  var v = String(el.value || '').trim().replace(/\s/g, '').replace(/,/g, '.');
  if(!v) return NaN;
  var n = parseFloat(v);
  return isFinite(n) ? n : NaN;
}
function fmt(n){
  return 'US$ ' + n.toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function pc(n){
  if(!isFinite(n)) return '—';
  return n.toLocaleString('es-AR', {maximumFractionDigits:1}) + '%';
}
function txt(id, v){ document.getElementById(id).textContent = v; }
function bar(a, b, c, ids){
  var t = a + b + c;
  if(t <= 0) t = 1;
  var col = ['var(--costo)', 'var(--inv)', 'var(--mio)'];
  [a, b, c].forEach(function(v, k){
    var e = document.getElementById(ids[k]);
    e.style.width = Math.max(0, v / t * 100) + '%';
    e.style.background = col[k];
  });
}
function showTab(n){
  document.getElementById('tab1').classList.toggle('on', n === 1);
  document.getElementById('tab2').classList.toggle('on', n === 2);
  document.getElementById('p1').classList.toggle('hide', n !== 1);
  document.getElementById('p2').classList.toggle('hide', n !== 2);
}

/* ---------- memoria de porcentajes (última vez) ---------- */
var STORE = 'cotizador.v1';
var PCTS = ['i1', 'm1', 'i2'];

function guardar(){
  try{
    var d = {};
    PCTS.forEach(function(id){
      var v = document.getElementById(id).value.trim();
      if(v) d[id] = v;
    });
    localStorage.setItem(STORE, JSON.stringify(d));
  }catch(e){}
}
function recordar(){
  var d;
  try{ d = JSON.parse(localStorage.getItem(STORE) || 'null'); }catch(e){ return; }
  if(!d) return;
  PCTS.forEach(function(id){
    if(typeof d[id] === 'string' && d[id]) document.getElementById(id).value = d[id];
  });
}

/* ---------- pantalla 1: precio final ---------- */
function calc1(){
  var big = document.getElementById('r1big'),
      body = document.getElementById('r1body'),
      warn = document.getElementById('r1warn');

  function fail(msg){
    big.textContent = '—';
    body.classList.add('hide');
    warn.classList.toggle('hide', !msg);
    warn.textContent = msg || '';
  }

  var C = num(document.getElementById('c1'));
  var i = num(document.getElementById('i1')) / 100;
  var m = num(document.getElementById('m1')) / 100;

  if(!isFinite(C) || C < 0) return fail('');
  if(!isFinite(i)) i = 0;
  if(!isFinite(m)) m = 0;

  if(i + m >= 1)
    return fail('Los porcentajes suman ' + pc((i + m) * 100) + ' del total: no queda nada para pagar la subcontratación, así que no hay precio posible.');

  var P = C / (1 - i - m);
  var inv = i * P;
  var mine = P - C - inv;
  var g = P - C;

  warn.classList.add('hide');
  body.classList.remove('hide');
  big.textContent = fmt(P);

  bar(C, inv, mine, ['b1a', 'b1b', 'b1c']);
  txt('l1a', fmt(C));       txt('l1ap', pc(C / P * 100));
  txt('l1b', fmt(inv));     txt('l1bp', pc(inv / P * 100));
  txt('l1c', fmt(mine));    txt('l1cp', pc(mine / P * 100));
  txt('l1d', fmt(mine / 2)); txt('l1dp', pc(mine / 2 / P * 100));
  txt('f1', 'Ganancia bruta ' + fmt(g));
}

/* ---------- pantalla 2: cuánto me queda ---------- */
function calc2(){
  var big = document.getElementById('r2big'),
      sub = document.getElementById('r2sub'),
      body = document.getElementById('r2body');

  var P = num(document.getElementById('p2p'));
  var C = num(document.getElementById('c2'));
  var i = num(document.getElementById('i2')) / 100;

  if(!isFinite(P) || P <= 0 || !isFinite(C) || C < 0){
    big.textContent = '—';
    sub.textContent = '';
    body.classList.add('hide');
    return;
  }
  if(!isFinite(i)) i = 0;

  var inv = i * P;
  var mine = P - C - inv;

  big.textContent = fmt(mine);
  big.style.color = mine < 0 ? '#b4451f' : '';
  sub.textContent = (mine < 0 ? 'Estás perdiendo plata. ' : '') + pc(mine / P * 100) + ' del total';

  body.classList.remove('hide');
  bar(C, inv, Math.max(mine, 0), ['b2a', 'b2b', 'b2c']);
  txt('l2a', fmt(C));       txt('l2ap', pc(C / P * 100));
  txt('l2b', fmt(inv));     txt('l2bp', pc(inv / P * 100));
  txt('l2c', fmt(mine));    txt('l2cp', pc(mine / P * 100));
  txt('l2d', fmt(mine / 2)); txt('l2dp', pc(mine / 2 / P * 100));
}

function calc(){ calc1(); calc2(); }

document.querySelectorAll('input').forEach(function(el){
  el.addEventListener('input', function(){
    calc();
    guardar();
  });
});

recordar();
calc();
</script>
</body>
</html>
